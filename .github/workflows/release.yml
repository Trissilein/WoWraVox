name: Release WoWraVox

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
      publish_target:
        description: Failed platform to resume for this existing release tag
        type: choice
        required: true
        default: github
        options:
          - wago
          - curseforge
          - github

permissions:
  contents: write

jobs:
  wago:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.publish_target }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            target="$INPUT_TARGET"
          else
            version="${GITHUB_REF_NAME#v}"
            target=all
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          # Retail patch from TOC interface number, e.g. 120100 -> 12.1.0
          interface=$(sed -n 's/^## Interface: *\([0-9]\{6\}\).*/\1/p' WoWraVox.toc | head -n1)
          if [ -z "$interface" ]; then
            echo "Cannot read ## Interface from WoWraVox.toc" >&2
            exit 1
          fi
          patch="$((10#${interface:0:2})).$((10#${interface:2:2})).$((10#${interface:4:2}))"
          {
            echo "version=$version"
            echo "stability=stable"
            echo "publish_target=$target"
            echo "patch=$patch"
          } >> "$GITHUB_OUTPUT"
      - name: Lua 5.1 syntax check
        shell: bash
        run: |
          python3 -m pip install --user lupa
          python3 tools/Test-LuaSyntax.py
      - name: Verify tagged release metadata
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./tools/Test-DailyRelease.ps1 -Version $env:VERSION -AllowExistingTag -RequireExistingTag
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ./tools/Get-ChangelogSection.ps1 -Version $env:VERSION | Set-Content -LiteralPath $notes -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NOTES_FILE=$notes"
      - id: package
        name: Package addon
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./tools/New-ReleaseArchive.ps1 -Version $env:VERSION
      - name: Upload Wago release
        if: ${{ steps.release.outputs.publish_target == 'all' || steps.release.outputs.publish_target == 'wago' }}
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PATCH: ${{ steps.release.outputs.patch }}
          STABILITY: ${{ steps.release.outputs.stability }}
        shell: bash
        run: |
          CHANGELOG=$(cat "$NOTES_FILE")
          metadata=$(jq -cn \
            --arg label "$VERSION" \
            --arg stability "$STABILITY" \
            --arg changelog "$CHANGELOG" \
            --arg patch "$PATCH" \
            '{label: $label, stability: $stability, changelog: $changelog, supported_retail_patch: $patch}')
          # Keep the response body: a bare "curl: (22) ... 422" hides why the API refused the upload.
          http_code=$(curl --silent --show-error -o "$RUNNER_TEMP/wago-response.txt" -w '%{http_code}' -X POST \
            --form-string "metadata=$metadata" \
            -F "file=@release/WoWraVox-$VERSION.zip" \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H "accept: application/json" \
            "https://addons.wago.io/api/projects/BNBwma6x/version")
          echo "Wago response (HTTP $http_code):"
          cat "$RUNNER_TEMP/wago-response.txt"; echo
          case "$http_code" in 2??) ;; *) echo "Wago upload failed" >&2; exit 1 ;; esac
      - name: Upload CurseForge release
        if: ${{ steps.release.outputs.publish_target == 'all' || steps.release.outputs.publish_target == 'curseforge' }}
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PATCH: ${{ steps.release.outputs.patch }}
          STABILITY: ${{ steps.release.outputs.stability }}
        shell: bash
        run: |
          case "$STABILITY" in
            stable) release_type=release ;;
            *) echo "Unsupported release channel: $STABILITY" >&2; exit 1 ;;
          esac
          CHANGELOG=$(cat "$NOTES_FILE")
          metadata=$(jq -cn \
            --arg display_name "WoWraVox $VERSION" \
            --arg release_type "$release_type" \
            --arg changelog "$CHANGELOG" \
            --arg patch "$PATCH" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $display_name, gameVersionNames: [$patch], releaseType: $release_type}')
          http_code=$(curl --silent --show-error -o "$RUNNER_TEMP/curseforge-response.txt" -w '%{http_code}' -X POST \
            --form-string "metadata=$metadata" \
            -F "file=@release/WoWraVox-$VERSION.zip;type=application/zip" \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            "https://www.curseforge.com/api/projects/1715995/upload-file")
          echo "CurseForge response (HTTP $http_code):"
          cat "$RUNNER_TEMP/curseforge-response.txt"; echo
          case "$http_code" in 2??) ;; *) echo "CurseForge upload failed" >&2; exit 1 ;; esac
      - name: Publish GitHub release for WowUp
        if: ${{ always() && steps.package.outcome == 'success' && (steps.release.outputs.publish_target == 'all' || steps.release.outputs.publish_target == 'github') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          archive="release/WoWraVox-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --title "WoWraVox $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
