name: Release WoWraVox

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v prefix
        required: true
      publish_target:
        description: Failed platform to resume for this existing release tag
        type: choice
        required: true
        default: github
        options:
          - wago
          - curseforge
          - github

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      stability: ${{ steps.release.outputs.stability }}
      publish_target: ${{ steps.release.outputs.publish_target }}
      patch: ${{ steps.release.outputs.patch }}
      forever_patch: ${{ steps.release.outputs.forever_patch }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.publish_target }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            target="$INPUT_TARGET"
          else
            version="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
            target=all
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          # Retail patch from TOC interface number, e.g. 120100 -> 12.1.0
          interface=$(sed -n 's/^## Interface: *\([0-9]\{6\}\).*/\1/p' WoWraVox.toc | head -n1)
          if [ -z "$interface" ]; then
            echo "Cannot read ## Interface from WoWraVox.toc" >&2
            exit 1
          fi
          major=$(printf '%s' "$interface" | cut -c1-2)
          minor=$(printf '%s' "$interface" | cut -c3-4)
          build=$(printf '%s' "$interface" | cut -c5-6)
          patch="$((10#$major)).$((10#$minor)).$((10#$build))"
          # WoW Forever patch from the Camelot TOC (first interface number), e.g. 16001 -> 1.60.1
          forever_interface=$(sed -n 's/^## Interface: *\([0-9]\{5,6\}\).*/\1/p' WoWraVox_Camelot.toc | head -n1)
          if [ -z "$forever_interface" ]; then
            echo "Cannot read ## Interface from WoWraVox_Camelot.toc" >&2
            exit 1
          fi
          forever_patch="$((10#$forever_interface / 10000)).$((10#$forever_interface / 100 % 100)).$((10#$forever_interface % 100))"
          commit="$(git rev-parse HEAD)"
          {
            echo "version=$version"
            echo "stability=stable"
            echo "publish_target=$target"
            echo "patch=$patch"
            echo "forever_patch=$forever_patch"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Lua syntax and harness tests
        shell: bash
        run: bash ./tools/Run-BuildHarnesses.sh
      - name: Verify tagged release metadata
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./tools/Test-DailyRelease.ps1 -Version $env:VERSION -AllowExistingTag -RequireExistingTag
      - name: Changelog section for TOC version
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $section = ./tools/Get-ChangelogSection.ps1 -Version $env:VERSION
          if ([string]::IsNullOrWhiteSpace($section)) { throw "Changelog section for $env:VERSION is empty." }
      - name: Build release ZIP (verification only)
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: ./tools/New-ReleaseArchive.ps1 -Version $env:VERSION

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Confirm tag still points to verified commit
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          checked_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          if [ "$checked_commit" != "$VERIFIED_COMMIT" ] || [ "$tag_commit" != "$VERIFIED_COMMIT" ]; then
            echo "Tag v$VERSION no longer points to verified commit $VERIFIED_COMMIT." >&2
            exit 1
          fi
      - name: Extract release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          ./tools/Get-ChangelogSection.ps1 -Version $env:VERSION | Set-Content -LiteralPath $notes -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "NOTES_FILE=$notes"
      - id: package
        name: Package addon
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: ./tools/New-ReleaseArchive.ps1 -Version $env:VERSION
      - name: Upload Wago release
        if: ${{ needs.verify.outputs.publish_target == 'all' || needs.verify.outputs.publish_target == 'wago' }}
        env:
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PATCH: ${{ needs.verify.outputs.patch }}
          FOREVER_PATCH: ${{ needs.verify.outputs.forever_patch }}
          STABILITY: ${{ needs.verify.outputs.stability }}
        shell: bash
        run: |
          CHANGELOG=$(cat "$NOTES_FILE")
          # Forever: docs.wago.io does not list the field yet. The data endpoint uses the plural, older plugins the
          # singular; send both and read the kept response body if Wago answers 422 (resume with publish_target=wago).
          metadata=$(jq -cn \
            --arg label "$VERSION" \
            --arg stability "$STABILITY" \
            --arg changelog "$CHANGELOG" \
            --arg patch "$PATCH" \
            --arg forever "$FOREVER_PATCH" \
            '{label: $label, stability: $stability, changelog: $changelog, supported_retail_patch: $patch,
              supported_forever_patch: $forever, supported_forever_patches: [$forever]}')
          # Keep the response body: a bare "curl: (22) ... 422" hides why the API refused the upload.
          http_code=$(curl --silent --show-error -o "$RUNNER_TEMP/wago-response.txt" -w '%{http_code}' -X POST \
            --form-string "metadata=$metadata" \
            -F "file=@release/WoWraVox-$VERSION.zip" \
            -H "authorization: Bearer $WAGO_API_TOKEN" \
            -H "accept: application/json" \
            "https://addons.wago.io/api/projects/BNBwma6x/version")
          echo "Wago response (HTTP $http_code):"
          cat "$RUNNER_TEMP/wago-response.txt"; echo
          case "$http_code" in 2??) ;; *) echo "Wago upload failed" >&2; exit 1 ;; esac
      - name: Upload CurseForge release
        if: ${{ needs.verify.outputs.publish_target == 'all' || needs.verify.outputs.publish_target == 'curseforge' }}
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          PATCH: ${{ needs.verify.outputs.patch }}
          FOREVER_PATCH: ${{ needs.verify.outputs.forever_patch }}
          STABILITY: ${{ needs.verify.outputs.stability }}
        shell: bash
        run: |
          case "$STABILITY" in
            stable) release_type=release ;;
            *) echo "Unsupported release channel: $STABILITY" >&2; exit 1 ;;
          esac
          CHANGELOG=$(cat "$NOTES_FILE")
          # Numeric game-version IDs for Retail and Forever (gameVersionNames cannot address Forever). Fail before
          # uploading if either is missing, so nothing half-published goes out.
          # The WoW host first: the generic www host answered 200 on 2026-11-09 but without our version names.
          versions=$(curl -sSf --retry 3 -H "X-Api-Token: $CURSEFORGE_API_TOKEN" https://wow.curseforge.com/api/game/versions \
            || curl -sSf --retry 3 -H "X-Api-Token: $CURSEFORGE_API_TOKEN" https://www.curseforge.com/api/game/versions)
          retail_id=$(jq -r --arg v "$PATCH" '[.[] | select(.name == $v)][0].id // empty' <<< "$versions")
          forever_id=$(jq -r --arg v "$FOREVER_PATCH" '[.[] | select(.name == $v)][0].id // empty' <<< "$versions")
          if [ -z "$retail_id" ] || [ -z "$forever_id" ]; then
            echo "CurseForge game versions missing: Retail $PATCH='$retail_id', Forever $FOREVER_PATCH='$forever_id'" >&2
            # Version names are public data; print what the API returned so the next attempt can be exact.
            jq -c 'if type == "array" then {count: length, sample: .[0:3], match: [.[] | select((.name // "") | test("^(12\\.1|1\\.60)"))]} else {type: type, keys: keys} end' <<< "$versions" >&2 || head -c 400 <<< "$versions" >&2
            exit 1
          fi
          echo "CurseForge game versions: Retail $PATCH = $retail_id, Forever $FOREVER_PATCH = $forever_id"
          metadata=$(jq -cn \
            --arg display_name "WoWraVox $VERSION" \
            --arg release_type "$release_type" \
            --arg changelog "$CHANGELOG" \
            --argjson retail "$retail_id" \
            --argjson forever "$forever_id" \
            '{changelog: $changelog, changelogType: "markdown", displayName: $display_name, gameVersions: [$retail, $forever], releaseType: $release_type}')
          http_code=$(curl --silent --show-error -o "$RUNNER_TEMP/curseforge-response.txt" -w '%{http_code}' -X POST \
            --form-string "metadata=$metadata" \
            -F "file=@release/WoWraVox-$VERSION.zip;type=application/zip" \
            -H "X-Api-Token: $CURSEFORGE_API_TOKEN" \
            "https://www.curseforge.com/api/projects/1715995/upload-file")
          echo "CurseForge response (HTTP $http_code):"
          cat "$RUNNER_TEMP/curseforge-response.txt"; echo
          case "$http_code" in 2??) ;; *) echo "CurseForge upload failed" >&2; exit 1 ;; esac
      - name: Publish GitHub release for WowUp
        if: ${{ always() && steps.package.outcome == 'success' && (needs.verify.outputs.publish_target == 'all' || needs.verify.outputs.publish_target == 'github') }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          archive="release/WoWraVox-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            asset_name="WoWraVox-$VERSION.zip"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset_name"; then
              echo "Release asset $asset_name already exists; keeping the published file."
            else
              gh release upload "$tag" "$archive"
            fi
          else
            gh release create "$tag" "$archive" \
              --title "WoWraVox $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
